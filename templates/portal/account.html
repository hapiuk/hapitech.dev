{% extends "app/base.html" %}
{% block title %}Your account{% endblock %}
{% block content %}
<div class="page-top"><div><h1>Your account</h1><p>{{ current_user.email }}</p></div></div>
<form method="post" class="card stack" style="max-width:480px">
  <input type="email" name="email" value="{{ current_user.email }}" autocomplete="username" hidden>
  <label class="field"><span>Current password</span><input type="password" name="current" autocomplete="current-password" required></label>
  <label class="field"><span>New password <small>(10+ characters)</small></span><input type="password" name="new" autocomplete="new-password" minlength="10" required></label>
  <label class="field"><span>Again</span><input type="password" name="new2" autocomplete="new-password" minlength="10" required></label>
  <div><button class="btn">Change password</button></div>
</form>
{% endblock %}
