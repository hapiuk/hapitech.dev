{# Search + filters for a Reviews list. Expects: total (int), active (bool), keep (dict of hidden args). #}
<form class="rv-search card" method="get" role="search">
  {% for k, v in keep.items() if v %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
  <label class="rv-search__q"><span aria-hidden="true">🔍</span><input type="search" name="q" value="{{ request.args.get('q', '') }}" placeholder="Search words, names or jobs…" aria-label="Search reviews" data-live-search {% if request.args.get('q') %}autofocus{% endif %}></label>
  <div class="rv-search__f">
    <select name="src" data-autosubmit aria-label="Where from">{% for v, l in [('', 'All places'), ('google', 'Google'), ('facebook', 'Facebook'), ('hapitech', 'HapiTech')] %}<option value="{{ v }}" {{ 'selected' if request.args.get('src', '') == v }}>{{ l }}</option>{% endfor %}</select>
    <select name="stars" data-autosubmit aria-label="Stars">{% for v, l in [('', 'Any stars'), ('5', '5★'), ('4', '4★'), ('3', '3★'), ('2', '2★'), ('1', '1★')] %}<option value="{{ v }}" {{ 'selected' if request.args.get('stars', '') == v }}>{{ l }}</option>{% endfor %}</select>
    <select name="replied" data-autosubmit aria-label="Replies">{% for v, l in [('', 'Replied or not'), ('yes', 'With a reply'), ('no', 'No reply yet')] %}<option value="{{ v }}" {{ 'selected' if request.args.get('replied', '') == v }}>{{ l }}</option>{% endfor %}</select>
    <select name="sort" data-autosubmit aria-label="Sort">{% for v, l in [('new', 'Newest first'), ('old', 'Oldest first'), ('low', 'Lowest rating'), ('high', 'Highest rating')] %}<option value="{{ v }}" {{ 'selected' if request.args.get('sort', 'new') == v }}>{{ l }}</option>{% endfor %}</select>
  </div>
  <p class="small muted rv-search__n">{{ total }} review{{ '' if total == 1 else 's' }}{% if active %} {{ 'matches' if total == 1 else 'match' }} · <a href="?{% for k, v in keep.items() if v %}{{ k }}={{ v }}&{% endfor %}">clear</a>{% endif %}</p>
</form>
