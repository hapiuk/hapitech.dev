<!-- templates/login.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='media/favicon/favicon-96x96.png') }}" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='media/favicon/favicon.svg') }}" />
  <link rel="shortcut icon" href="{{ url_for('static', filename='media/favicon/favicon.ico') }}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='media/favicon/apple-touch-icon.png') }}" />
  <meta name="apple-mobile-web-app-title" content="HapiTech" />
  <link rel="manifest" href="/static/media/favicon/site.webmanifest" />
  <title>HapiTech Client Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    /* login-only styles (doesn't depend on style.css existing) */
    *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;}
    html,body{height:100%;background:#0b0f17;color:#e6f0ff;}
    a{color:inherit}

    .bg{
      position:fixed;inset:0;z-index:0;
      background:
        radial-gradient(1000px 700px at 10% 10%, rgba(80,140,255,0.12), transparent 40%),
        radial-gradient(800px 600px at 80% 80%, rgba(180,90,255,0.12), transparent 40%),
        linear-gradient(180deg,#081021 0%,#0b0f17 40%);
      filter: blur(40px);
    }

    .container{
      position:relative;z-index:2;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .neon-card{
      width:100%;
      max-width:520px;
      padding:22px;
      border-radius:16px;
      background:rgba(10,14,22,0.45);
      border:1px solid rgba(120,180,255,0.08);
      box-shadow:0 10px 40px rgba(3,6,12,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
      backdrop-filter: blur(10px) saturate(130%);
      position:relative;
      overflow:hidden;
    }

    .logo-wrap{
      display:flex;
      justify-content:center;
      margin-bottom:10px;
    }
    .logo{
      width:64px;height:64px;object-fit:contain;
      filter: drop-shadow(0 10px 30px rgba(80,140,255,0.18));
    }

    .title{
      text-align:center;
      font-size:20px;
      font-weight:850;
      letter-spacing:.3px;
      margin-top:6px;
    }

    .tagline{
      text-align:center;
      font-size:12px;
      opacity:.75;
      margin-top:6px;
      margin-bottom:16px;
    }

    .login-form{display:grid;gap:12px;margin-top:6px;}
    .field{display:grid;gap:8px;}
    .field span{font-size:12px;opacity:.75;letter-spacing:.2px;}
    .field input{
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(10,12,16,0.65);
      color:#eaf6ff;
      outline:none;
      font-size:14px;
    }

    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      padding:11px 14px;border-radius:12px;
      border:1px solid rgba(140,200,255,0.18);
      background:linear-gradient(90deg,rgba(80,160,255,0.14),rgba(180,100,255,0.14)), rgba(10,12,16,0.6);
      color:#eaf6ff;
      cursor:pointer;
      font-weight:700;
      letter-spacing:.3px;
      box-shadow:0 6px 26px rgba(80,140,255,0.12);
      transition:transform .15s, box-shadow .15s, border-color .15s;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(120,160,255,0.18);}
    .neon{} /* keep your class name intact */

    .message{
      min-height:18px;
      font-size:12px;
      opacity:.9;
      margin-top:2px;
    }

    .footer-links{
      margin-top:14px;
      display:grid;
      gap:6px;
      text-align:center;
      font-size:12px;
      opacity:.75;
    }
    .footer-links a{opacity:.95;text-decoration:underline;}

    /* contact bubble + popup basic styling */
    .contact-bubble{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:6;
      width:52px;height:52px;
      border-radius:999px;
      border:1px solid rgba(140,200,255,0.18);
      background:rgba(10,12,16,0.55);
      color:#eaf6ff;
      cursor:pointer;
      box-shadow:0 10px 30px rgba(80,140,255,0.14);
    }

    .contact-popup{
      position:fixed;
      right:18px;
      bottom:84px;
      z-index:6;
      width:min(360px, calc(100vw - 36px));
      border-radius:16px;
      background:rgba(10,14,22,0.75);
      border:1px solid rgba(120,180,255,0.10);
      box-shadow:0 14px 50px rgba(0,0,0,0.55);
      backdrop-filter: blur(10px) saturate(130%);
      display:none;
      overflow:hidden;
    }
    .contact-popup.is-open{display:block;}
    .contact-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 12px;
      border-bottom:1px solid rgba(120,180,255,0.10);
    }
    .close-x{
      border:0;background:transparent;color:#eaf6ff;cursor:pointer;
      font-size:16px;opacity:.8;
    }
    #contactForm{padding:12px;display:grid;gap:10px;}
    #contactForm input,#contactForm textarea{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(10,12,16,0.65);
      color:#eaf6ff;
      outline:none;
      font-size:14px;
    }
    .contact-actions{display:flex;justify-content:flex-end;}

    /* clients dock */
    .clients-dock{
      position:fixed;
      left:16px;
      bottom:16px;
      z-index:6;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .clients-dock__items{
      display:flex;
      gap:10px;
      padding:10px;
      border-radius:16px;
      border:1px solid rgba(120,180,255,0.10);
      background:rgba(10,14,22,0.55);
      backdrop-filter: blur(10px) saturate(130%);
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
    }
    .client-chip{
      width:44px;height:44px;
      border-radius:14px;
      display:grid;place-items:center;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(10,12,16,0.45);
      overflow:hidden;
      transition:transform .15s, border-color .15s;
    }
    .client-chip:hover{transform:translateY(-1px);border-color:rgba(180,120,255,0.28);}
    .client-chip img{width:100%;height:100%;object-fit:cover;}

    .clients-dock__label-wrap{padding-left:6px;}
    .clients-dock__label{
      font-size:11px;
      letter-spacing:.7px;
      text-transform:uppercase;
      opacity:.7;
    }

    /* planet link easter egg */
    .planet-link{
      position:absolute;
      right:14px;
      bottom:14px;
      width:36px;height:36px;
      border-radius:999px;
      display:grid;place-items:center;
      border:1px solid rgba(140,200,255,0.16);
      background:rgba(10,12,16,0.35);
      color:rgba(230,240,255,0.78);
      text-decoration:none;
      opacity:.55;
      transition: transform .15s, opacity .15s, border-color .15s, background .15s;
    }
    .planet-link:hover{
      opacity:.95;
      transform:translateY(-1px);
      border-color: rgba(180,120,255,0.28);
      background:rgba(10,12,16,0.55);
    }
    .planet-link--left{
      left:14px;
      right:auto;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <main class="container">
    <div class="neon-card">
      <div class="logo-wrap">
        <img src="{{ url_for('static', filename='media/logo.png') }}" alt="Logo" class="logo">
      </div>
      <h1 class="title">HapiTech Client Portal</h1>
      <p class="tagline">Access your digital workspace</p>

      <form id="loginForm" class="login-form" onsubmit="return false;">
        <label class="field">
          <span>Username</span>
          <input id="username" autocomplete="username" type="text" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="loginBtn" class="btn neon" type="button">Sign In</button>
        <p id="loginMsg" class="message"></p>
      </form>

      <div class="footer-links">
        <small>Need help? <a href="#" id="helpLink">Contact support</a></small>
        <small>Showcase: GMG • Roland’s • Spartan</small>
      </div>

      <a class="planet-link planet-link--left" href="https://hapitech.report" target="_blank" rel="noopener" title="HapiTech Report" aria-label="HapiTech Report">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="5" y="3" width="14" height="18" rx="1" stroke="currentColor" stroke-width="2" opacity=".9"/>
          <path d="M9 2.5h6v2.2a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1V2.5Z" stroke="currentColor" stroke-width="2" opacity=".9"/>
          <path d="M8.5 12.5l2 2 4-4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
          <path d="M8.5 16.5h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".6"/>
        </svg>
      </a>
      <a class="planet-link" href="https://hapitech.space" target="_blank" rel="noopener" title="Solar Journal" aria-label="Solar Journal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z" stroke="currentColor" stroke-width="2" opacity=".9"/>
          <path d="M3 12c3.5-3 14.5-3 18 0" stroke="currentColor" stroke-width="2" opacity=".7"/>
          <path d="M3 12c3.5 3 14.5 3 18 0" stroke="currentColor" stroke-width="2" opacity=".5"/>
        </svg>
      </a>
    </div>
  </main>

  <!-- Floating Contact Bubble -->
  <button id="contactBubble" class="contact-bubble" title="Contact">
    💬
  </button>

  <!-- Floating Clients Dock (bottom-left) -->
  <div class="clients-dock" aria-label="Our clients">
    <div class="clients-dock__items">
      <a class="client-chip" href="https://gravemistakegames.com" target="_blank" rel="noopener" title="GraveMistakeGames">
        <img src="{{ url_for('static', filename='media/clients/gravemistakegames.png') }}" alt="GraveMistakeGames logo">
      </a>

      <a class="client-chip" href="https://rolandshandyman.co.uk" target="_blank" rel="noopener" title="Roland's Handyman">
        <img src="{{ url_for('static', filename='media/clients/rolandshandyman.png') }}" alt="Roland's Handyman logo">
      </a>

      <a class="client-chip" href="https://spartanbricklaying.co.uk" target="_blank" rel="noopener" title="Spartan Bricklaying">
        <img src="{{ url_for('static', filename='media/clients/spartanbricklaying.png') }}" alt="Spartan Bricklaying logo">
      </a>
    </div>

    <div class="clients-dock__label-wrap">
      <div class="clients-dock__label">Hapitech Clients</div>
    </div>
  </div>

  <!-- Contact popup -->
  <div id="contactPopup" class="contact-popup">
    <div class="contact-header">
      <strong>Contact HapiTech</strong>
      <button id="contactClose" class="close-x">✕</button>
    </div>
    <form id="contactForm" onsubmit="return false;">
      <label><input id="contactName" placeholder="Your name" required></label>
      <label><input id="contactEmail" placeholder="Email" type="email" required></label>
      <label><textarea id="contactMessage" placeholder="How can we help?" rows="4" required></textarea></label>
      <div class="contact-actions">
        <button id="sendContact" class="btn neon" type="button">Send</button>
      </div>
      <p id="contactStatus" class="message"></p>
    </form>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
