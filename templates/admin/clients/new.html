<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>New Client • Admin</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
	<div style="max-width:820px;margin:0 auto;padding:24px;">
		<h1 style="margin:0 0 14px;">New client</h1>

		<form method="post" style="display:grid;gap:12px;">
			<label>
				<div>Name</div>
				<input name="name" required style="width:100%;padding:10px;border-radius:10px;">
			</label>

			<label>
				<div>Primary email</div>
				<input name="primary_email" type="email" style="width:100%;padding:10px;border-radius:10px;">
			</label>

			<label>
				<div>Phone</div>
				<input name="phone" style="width:100%;padding:10px;border-radius:10px;">
			</label>

			<label>
				<div>Status</div>
				<select name="status" style="width:100%;padding:10px;border-radius:10px;">
					<option value="active">active</option>
					<option value="paused">paused</option>
					<option value="archived">archived</option>
				</select>
			</label>

			<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;">
				<button class="btn" type="submit">Create</button>
				<a class="btn" href="{{ url_for('admin_clients') }}">Cancel</a>
			</div>
		</form>
	</div>
</body>
</html>
