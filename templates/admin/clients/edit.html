<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Edit {{ client.name }} • Admin</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
	<div style="max-width:820px;margin:0 auto;padding:24px;">
		<h1 style="margin:0 0 14px;">Edit client</h1>

		<form method="post" style="display:grid;gap:12px;">
			<label>
				<div>Name</div>
				<input name="name" required value="{{ client.name }}" style="width:100%;padding:10px;border-radius:10px;">
			</label>

			<label>
				<div>Primary email</div>
				<input name="primary_email" type="email" value="{{ client.primary_email or '' }}" style="width:100%;padding:10px;border-radius:10px;">
			</label>

			<label>
				<div>Phone</div>
				<input name="phone" value="{{ client.phone or '' }}" style="width:100%;padding:10px;border-radius:10px;">
			</label>

			<label>
				<div>Status</div>
				<select name="status" style="width:100%;padding:10px;border-radius:10px;">
					<option value="active" {% if client.status=='active' %}selected{% endif %}>active</option>
					<option value="paused" {% if client.status=='paused' %}selected{% endif %}>paused</option>
					<option value="archived" {% if client.status=='archived' %}selected{% endif %}>archived</option>
				</select>
			</label>

			<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;">
				<button class="btn" type="submit">Save</button>
				<a class="btn" href="{{ url_for('admin_clients_view', client_id=client.id) }}">Cancel</a>
			</div>
		</form>
	</div>
</body>
</html>
